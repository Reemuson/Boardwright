# KiBot preflight for setting Text Variables
# https://kibot.readthedocs.io/en/latest/configuration/preflights/set_text_variables.html

kibot:
  version: 1

preflight:
  update_xml: true
  set_text_variables:

    # Git related information
    - variable: 'REVISION'
      command: 'if [ -f .boardwright/release.env ]; then . .boardwright/release.env; fi; if [ -n "$RELEASE_VERSION" ]; then echo "$RELEASE_VERSION"; else git describe --tags --exact-match 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo ""; fi'
    - variable: 'BOARD_REVISION'
      text: '@BOARD_REVISION@'
    - variable: 'RELEASE_VERSION'
      command: 'if [ -f .boardwright/release.env ]; then . .boardwright/release.env; fi; if [ -n "$RELEASE_VERSION" ]; then echo "$RELEASE_VERSION"; else git describe --tags --exact-match 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo ""; fi'
    - variable: 'RELEASE_DATE'
      command: 'git log -1 --format="%ad" --date="format:%d-%b-%Y"'
    - variable: 'RELEASE_DATE_NUM'
      command: 'git log -1 --format="%ad" --date=short'
    - variable: 'GIT_HASH_SCH'
      command: 'git log --no-merges -1 --format="%h" -- "$KIBOT_SCH_NAME"'
    - variable: 'GIT_HASH_PCB'
      command: 'git log --no-merges -1 --format="%h" -- "$KIBOT_PCB_NAME"'
    - variable: 'GIT_URL'
      text: '@GIT_URL@'

    # Metadata
    - variable: 'PROJECT_NAME'
      text: '@PROJECT_NAME@'
    - variable: 'BOARD_NAME'
      text: '@BOARD_NAME@'
    - variable: 'PCBA_NUMBER'
      text: '@PCBA_NUMBER@'
    - variable: 'PCB_NUMBER'
      text: '@PCB_NUMBER@'
    - variable: 'DOCUMENT_REVISION'
      text: '@DOCUMENT_REVISION@'
    - variable: 'DOCUMENT_REVISION_SCHEME'
      text: '@DOCUMENT_REVISION_SCHEME@'
    - variable: 'DRAWN_BY'
      text: '@DRAWN_BY@'
    - variable: 'DRAWN_DATE'
      text: '@DRAWN_DATE@'
    - variable: 'CHECKED_BY'
      text: '@CHECKED_BY@'
    - variable: 'CHECKED_DATE'
      text: '@CHECKED_DATE@'
    - variable: 'APPROVED_BY'
