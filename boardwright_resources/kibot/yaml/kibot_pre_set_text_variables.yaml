      expand_in_command: true
      command: '[ -s "@FABRICATION_DIR@/%f-fabrication_notes%v.txt" ] && cat "@FABRICATION_DIR@/%f-fabrication_notes%v.txt" || cat "@REPORT_TEMPLATE_DIR@/fabrication_notes.txt"'
